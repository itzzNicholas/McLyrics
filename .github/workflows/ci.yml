name: CI

# Runs only when something that ends up in a jar (or how it is built) changes.
# README, docs, licences, images, .gitignore, issue/PR templates and the emoji-atlas helper script
# never trigger a build.
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
    paths:
      - 'core/**'
      - 'targets/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'targets/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: core (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Test core
        run: ./gradlew --no-daemon :core:test
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/

  build:
    name: build ${{ matrix.target }}
    needs: core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fabric-1.20.1, forge-1.20.1, forge-1.12.2, forge-1.8.9]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build
        working-directory: targets/${{ matrix.target }}
        run: ./gradlew --no-daemon build
      - name: Collect jar
        run: |
          mkdir -p out
          find targets/${{ matrix.target }}/build/libs -name '*.jar' \
            ! -name '*-dev.jar' ! -name '*-sources.jar' ! -name '*-all.jar' ! -name '*-shadow.jar' -exec cp {} out/ \;
          ls -la out
      - name: Smoke-check the jar
        run: |
          jar=$(ls out/*.jar | head -1)
          unzip -l "$jar" | tail -n +1 | grep -v '\.class$' | head -60
          unzip -l "$jar" | grep -c '\.class$' | sed 's/^/class files: /'
          ls -la "$jar"
          fail=0
          for entry in dev/lyricsworld/LyricsWorld.class dev/lyricsworld/scene/SceneBuilder.class \
                       assets/lyricsworld/emoji/rules_en.json assets/lyricsworld/emoji/rules_it.json \
                       assets/lyricsworld/emoji/atlas.json assets/lyricsworld/textures/emoji_atlas.png \
                       assets/lyricsworld/version.txt LICENSE_LyricsWorld; do
            unzip -l "$jar" | grep -q " $entry\$" || { echo "MISSING in jar: $entry"; fail=1; }
          done
          exit $fail
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out/*.jar
          if-no-files-found: error
