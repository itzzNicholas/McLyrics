name: Release

# A release is made when (a) a push to main changes something that ends up in a jar - the version is
# the next patch of the latest v* tag (add "#minor" or "#major" to a commit message to bump higher) -
# or (b) a v* tag is pushed by hand (skipped when that tag only differs from the previous one by
# docs/README/licence-type files), or (c) the workflow is started manually with an explicit version.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'core/**'
      - 'targets/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (e.g. 1.2.0)'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          RELEVANT='^(core/|targets/|gradle/|build\.gradle$|settings\.gradle$|gradle\.properties$|gradlew(\.bat)?$)'
          last_tag() { git tag --list 'v[0-9]*' --sort=-v:refname | grep -v "^${1:-__none__}\$" | head -1; }

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
            prev="$(last_tag "$tag" || true)"
            if [[ -n "$prev" ]] && ! git diff --name-only "$prev" "$tag" | grep -Eq "$RELEVANT"; then
              echo "Only non-mod files changed since $prev - no release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # push to main (already path-filtered by the trigger)
          prev="$(last_tag || true)"
          if [[ -z "$prev" ]]; then
            next="1.0.0"
          else
            if [[ -n "$(git log "$prev"..HEAD --pretty=%B | grep -F '#major' || true)" ]]; then bump=major
            elif [[ -n "$(git log "$prev"..HEAD --pretty=%B | grep -F '#minor' || true)" ]]; then bump=minor
            else bump=patch; fi
            IFS=. read -r ma mi pa <<< "${prev#v}"
            case $bump in
              major) next="$((ma+1)).0.0" ;;
              minor) next="${ma}.$((mi+1)).0" ;;
              patch) next="${ma}.${mi}.$((pa+1))" ;;
            esac
            if ! git diff --name-only "$prev" HEAD | grep -Eq "$RELEVANT"; then
              echo "No mod files changed since $prev - no release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        target: [fabric-1.20.1, forge-1.20.1, forge-1.12.2, forge-1.8.9]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Test core (once)
        if: matrix.target == 'fabric-1.20.1'
        run: ./gradlew --no-daemon :core:test
      - name: Build
        working-directory: targets/${{ matrix.target }}
        run: ./gradlew --no-daemon -PmodVersion=${{ needs.plan.outputs.version }} build
      - name: Collect jar
        run: |
          mkdir -p out
          find targets/${{ matrix.target }}/build/libs -name '*.jar' \
            ! -name '*-dev.jar' ! -name '*-sources.jar' ! -name '*-all.jar' ! -name '*-shadow.jar' -exec cp {} out/ \;
          test "$(ls out/*.jar | wc -l)" = 1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out/*.jar
          if-no-files-found: error

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true
      - name: List assets
        run: ls -la jars
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          name: LyricsWorld ${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: jars/*.jar
