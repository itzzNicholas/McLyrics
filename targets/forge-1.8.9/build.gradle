plugins {
    id 'java'
    id 'gg.essential.loom' version '0.10.0.5'
    id 'dev.architectury.architectury-pack200' version '0.1.3'
}

base { archivesName = 'lyricsworld-forge-1.8.9' }
apply from: '../common.gradle'

repositories {
    mavenCentral()
}

loom {
    forge {
        pack200Provider = new dev.architectury.pack200.java.Pack200Adapter()
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.8.9'
    mappings 'de.oceanlabs.mcp:mcp_stable:22-1.8.9'
    forge 'net.minecraftforge:forge:1.8.9-11.15.1.2318-1.8.9'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

// @Mod(version = ModVersion.VERSION) needs a compile-time constant
def genJava = layout.buildDirectory.dir('generated/sources/version')
tasks.register('genVersionJava') {
    inputs.property('v', project.version)
    outputs.dir(genJava)
    doLast {
        def f = genJava.get().file('dev/lyricsworld/forge/legacy/ModVersion.java').asFile
        f.parentFile.mkdirs()
        f.text = "package dev.lyricsworld.forge.legacy;\n\npublic final class ModVersion {\n    public static final String VERSION = \"${project.version}\";\n\n    private ModVersion() {}\n}\n"
    }
}
sourceSets.main.java.srcDir(genJava)
tasks.named('compileJava') { dependsOn 'genVersionJava' }

processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') {
        expand 'version': project.version
    }
}
